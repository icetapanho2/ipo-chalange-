# Publica o site estático (modo navegador) no GitHub Pages a cada push para a main.
# Uma vez só: Settings → Pages → Source: "GitHub Actions". (Em conta gratuita, o repositório tem de ser público.)
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build:estatico -- --base=/${{ github.event.repository.name }}/
      # Sem reescritas no Pages: um endereço directo (ex.: /triagem) abre o 404.html, que é a própria app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
